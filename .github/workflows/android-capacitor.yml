# Construit l'application Android Capacitor (WebView embarquee, comme l'app
# iPhone) sur les serveurs GitHub — 12/11/2026. Remplace la coque TWA du
# dossier android/ (workflow android.yml), refusee par les prestataires de
# testeurs et mal comptee par Google pendant le test ferme.
#
# Le projet Android n'est PAS dans le depot : il est genere a chaque
# compilation par `npx cap add android` dans ios-app/ (coque partagee iOS +
# Android, meme capacitor.config.json), puis retouche par
# ios-app/patch-android.js (version, signature, SDK, liens d'application).
#
# Resultats (onglet Actions → le run → « Artifacts ») :
#   - meet-aaron-android-debug-apk : APK de test (signature debug) ;
#   - meet-aaron-android-aab : AAB de production signe avec la cle d'upload
#     (secrets ANDROID_*), a deposer dans la Play Console.
#
# versionCode = 100 + numero du run : toujours croissant, jamais deux fois le
# meme (Google refuse un versionCode deja envoye ; la TWA a utilise le 1).
#
# Un patch applique par le robot ne declenche PAS ce workflow : lancer
# « Run workflow » a la main apres un patch qui touche ios-app/.
#
# Notifications (14/11/2026) : si le secret GOOGLE_SERVICES_JSON existe
# (fichier google-services.json du projet Firebase), ios-app/android-push.js
# embarque le plugin de notifications et ce fichier. Sans le secret, l'app
# est compilee sans notifications, comme avant.

name: Android (Capacitor)

on:
  push:
    branches: [main]
    paths:
      - 'ios-app/**'
      - '.github/workflows/android-capacitor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ios-app
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      APP_VERSION: '1.0.0'
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Capacitor 8 exige Java 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: SDK Android (API 36)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Dependances de la coque
        run: npm install

      - name: Notifications Firebase (si le secret existe)
        run: node android-push.js config

      - name: Generer le projet Android
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Fichier Firebase (si le secret existe)
        run: node android-push.js files

      - name: Icones et ecran de lancement
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#0D0F20' --splashBackgroundColor '#0D0F20' --splashBackgroundColorDark '#0D0F20'

      - name: Retoucher le projet (version, signature, SDK, liens)
        run: |
          export VERSION_CODE=$((100 + VERSION_CODE))
          node patch-android.js

      - name: APK de test (signature debug)
        working-directory: ios-app/android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Publier l'APK de test
        uses: actions/upload-artifact@v4
        with:
          name: meet-aaron-android-debug-apk
          path: ios-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Preparer la cle d'upload
        if: ${{ env.HAS_UPLOAD_KEY != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: AAB de production (signature release)
        if: ${{ env.HAS_UPLOAD_KEY != '' }}
        working-directory: ios-app/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Publier l'AAB de production
        if: ${{ env.HAS_UPLOAD_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: meet-aaron-android-aab
          path: ios-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
