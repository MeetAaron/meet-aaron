# Construit l'application Android (dossier android/, coque TWA) sur les
# serveurs GitHub — aucun SDK Android à installer sur le PC d'Alex.
#
# Deux résultats possibles :
#   - APK de TEST (toujours) : signé avec android/app/debug.keystore, à
#     installer à la main sur un téléphone Android (« sources inconnues »).
#     À récupérer dans l'onglet Actions → le run → « Artifacts ».
#   - AAB de PRODUCTION (seulement si les 4 secrets ANDROID_* existent) :
#     signé avec la clé d'upload d'Alex, prêt à déposer dans la Play Console.
#
# Se lance à chaque modification de android/ ou à la main (bouton
# « Run workflow » dans l'onglet Actions).

name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      # GitHub interdit `secrets` dans les conditions `if` : on passe par une
      # variable d'environnement, vide tant que le secret n'existe pas.
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK de test (signature debug)
        run: gradle :app:assembleDebug --no-daemon

      - name: Publier l'APK de test
        uses: actions/upload-artifact@v4
        with:
          name: meet-aaron-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ---- Production : uniquement quand la clé d'upload est fournie ----
      - name: Préparer la clé d'upload
        if: ${{ env.HAS_UPLOAD_KEY != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: AAB de production (signature release)
        if: ${{ env.HAS_UPLOAD_KEY != '' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --no-daemon

      - name: Publier l'AAB de production
        if: ${{ env.HAS_UPLOAD_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: meet-aaron-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
