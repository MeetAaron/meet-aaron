# Scan de sécurité DAST exigé par CASA (App Defense Alliance), lancé sur les
# serveurs GitHub — rien à installer sur le PC d'Alex.
#
# TAC Security ne lance pas le scan (réponse du support, 16/10/2026) : c'est
# à nous de le faire avec la configuration ADA, en couvrant la partie
# connectée de l'application, puis de déposer les résultats dans le portail.
#
# Scans OWASP ZAP, avec la configuration officielle ADA
# (appdefensealliance.dev/casa/tier-2/ast-guide/dynamic-scan) :
#   - full : zap-full-scan sur https://meetaaron.app (pages publiques et
#     connectées, en-tête Authorization du compte de test) ;
#   - api1, api2 : zap-api-scan sur les routes API en LECTURE SEULE
#     (security/casa/openapi-readonly.json, coupé en deux moitiés). Les
#     routes qui envoient des e-mails ou appellent l'IA payante ne sont pas
#     attaquées automatiquement.
#
# UN JOB PAR SCAN, L'UN APRÈS L'AUTRE (run #5, 17/10/2026) : après le scan
# web, toutes les requêtes du scan API, lancé depuis la même machine, ont
# reçu la page « Vercel Security Checkpoint » (403) : la protection
# anti-robots de Vercel avait repéré l'adresse IP. Chaque job tourne sur une
# machine GitHub neuve, donc une autre adresse IP, et commence par vérifier
# qu'une route API répond bien en JSON : sinon il s'arrête au lieu de
# scanner la page de blocage pendant une heure.
#
# Pré-requis (une fois, par Alex) : secrets GitHub CASA_TEST_EMAIL et
# CASA_TEST_PASSWORD = compte de TEST dédié, sans boîte mail connectée.
#
# Résultats : publiés sur la branche casa-zap-results (dossier
# results/<date>/) et en artefacts du run.

name: CASA ZAP scan

on:
  workflow_dispatch:
    inputs:
      scans:
        description: "Scans à lancer : api (routes connectées), full (site web) ou all"
        type: choice
        options: [api, all, full]
        default: api

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.p.outputs.list }}
    steps:
      - id: p
        run: |
          case "${{ inputs.scans }}" in
            api)  echo 'list=["api1","api2"]' >> "$GITHUB_OUTPUT" ;;
            full) echo 'list=["full"]' >> "$GITHUB_OUTPUT" ;;
            *)    echo 'list=["api1","api2","full"]' >> "$GITHUB_OUTPUT" ;;
          esac

  scan:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Un seul à la fois : deux scanners en parallèle doubleraient le débit
      # vu par Vercel et déclencheraient sa protection.
      max-parallel: 1
      matrix:
        scan: ${{ fromJSON(needs.plan.outputs.list) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configuration ADA
        run: |
          mkdir -p wrk
          curl -sSfL -o ada.zip https://appdefensealliance.dev/static/casa/tier-2/files/zap-casa-config.zip
          curl -sSfL -o ada-api.zip https://appdefensealliance.dev/static/casa/tier-2/files/zap-casa-api-config.zip
          unzip -l ada.zip; unzip -l ada-api.zip
          mkdir -p ada-full ada-api
          unzip -o -j ada.zip -d ada-full
          unzip -o -j ada-api.zip -d ada-api
          cp "$(ls ada-full/*.conf | head -1)" wrk/ada-full.conf
          cp "$(ls ada-api/*.conf | head -1)" wrk/ada-api.conf
          sha256sum ada.zip ada-api.zip | tee wrk/ada-config-sha256.txt
          echo "Adresse IP publique de cette machine : $(curl -s https://api.ipify.org || echo inconnue)"

      - name: Jeton du compte de test
        env:
          CASA_TEST_EMAIL: ${{ secrets.CASA_TEST_EMAIL }}
          CASA_TEST_PASSWORD: ${{ secrets.CASA_TEST_PASSWORD }}
        run: python3 security/casa/get_test_token.py

      - name: Spécification API (routes en lecture seule)
        run: |
          sed "s/__USER_ID__/${USER_ID}/g" security/casa/openapi-readonly.json > wrk/openapi.json
          python3 - <<'PY'
          import json
          spec = json.load(open("wrk/openapi.json"))
          paths = list(spec["paths"].items())
          half = (len(paths) + 1) // 2
          for n, part in ((1, paths[:half]), (2, paths[half:])):
              out = dict(spec, paths=dict(part))
              json.dump(out, open("wrk/openapi-%d.json" % n, "w"), indent=1)
              print("moitié", n, ":", len(part), "routes")
          PY

      # Vérification avant scan : une route connectée doit répondre en JSON.
      # Si Vercel renvoie sa page de blocage, on s'arrête tout de suite.
      - name: Vérification (l'API répond-elle, ou Vercel bloque-t-il ?)
        run: |
          code=$(curl -s -o wrk/preflight.txt -w '%{http_code}' \
            -H "Authorization: Bearer ${ZAP_TOKEN}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:125.0) Gecko/20100101 Firefox/125.0" \
            "https://meetaaron.app/api/preferences?user_id=${USER_ID}")
          echo "HTTP ${code}"; head -c 300 wrk/preflight.txt; echo
          if grep -q "Security Checkpoint" wrk/preflight.txt; then
            echo "::error::Vercel Security Checkpoint : l'adresse IP de cette machine est bloquée par Vercel. Scan annulé."
            exit 1
          fi
          [ "$code" = "200" ] || { echo "::error::La route de test ne répond pas 200 (HTTP ${code}). Scan annulé."; exit 1; }

      # Débit volontairement limité (1 requête à la fois, 400 ms entre deux) :
      # au run #3 (16/10), la protection DDoS de Vercel a présenté sa page
      # « Vercel Security Checkpoint » au scanner. Plafonds de durée : le
      # jeton Supabase vaut 1 h (scans API plafonnés à 50 min) et le job a
      # 2 h. PYTHONUNBUFFERED rend la progression visible en direct.
      - name: Scan ZAP (${{ matrix.scan }})
        continue-on-error: true
        run: |
          S="${{ matrix.scan }}"
          if [ "$S" = "full" ]; then
            CMD="zap-full-scan.py -t https://meetaaron.app -c ada-full.conf -m 5 -T 100 -j"
            Z="-config scanner.threadPerHost=1 -config scanner.delayInMs=400 -config scanner.maxScanDurationInMins=90 -config scanner.maxRuleDurationInMins=8 -config spider.thread=1 -config ajaxSpider.numberOfBrowsers=1"
          else
            N="${S#api}"
            CMD="zap-api-scan.py -t /zap/wrk/openapi-${N}.json -f openapi -c ada-api.conf -T 55"
            Z="-config scanner.threadPerHost=1 -config scanner.delayInMs=400 -config scanner.maxScanDurationInMins=50 -config scanner.maxRuleDurationInMins=4"
          fi
          docker run --rm -u root -v "$PWD/wrk:/zap/wrk:rw" -e PYTHONUNBUFFERED=1 \
            -e ZAP_AUTH_HEADER=Authorization \
            -e ZAP_AUTH_HEADER_VALUE="Bearer ${ZAP_TOKEN}" \
            -e ZAP_AUTH_HEADER_SITE=meetaaron.app \
            ghcr.io/zaproxy/zaproxy:stable $CMD -z "$Z" \
            -x "results-${S}.xml" -r "results-${S}.html" -J "results-${S}.json" -I 2>&1 | tee "wrk/results-${S}-log.txt"

      - name: Contrôle des résultats (page de blocage Vercel ?)
        if: always()
        run: |
          S="${{ matrix.scan }}"
          n=$(grep -o "Security Checkpoint" "wrk/results-${S}.json" 2>/dev/null | wc -l || true)
          echo "Occurrences de « Vercel Security Checkpoint » dans le rapport ${S} : ${n}" | tee "wrk/results-${S}-checkpoint.txt"
          [ "${n:-0}" = "0" ] || echo "::warning::Le rapport ${S} contient la page de blocage Vercel (${n} fois)."

      - name: Artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casa-zap-${{ matrix.scan }}
          path: |
            wrk/results-*
            wrk/ada-config-sha256.txt

  publish:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: casa-zap-*
          path: dl
          merge-multiple: true
      - name: Publication sur la branche casa-zap-results
        run: |
          set -e
          D="results/$(date -u +%Y-%m-%d_%H%M)"
          mkdir -p "/tmp/out/$D"
          cp -r dl/. "/tmp/out/$D/" 2>/dev/null || true
          ls -la "/tmp/out/$D"
          git config user.name "casa-scan"
          git config user.email "noreply@meetaaron.app"
          git fetch origin casa-zap-results || true
          if git rev-parse --verify origin/casa-zap-results >/dev/null 2>&1; then
            git checkout -B casa-zap-results origin/casa-zap-results
          else
            git checkout --orphan casa-zap-results
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p results
          cp -r "/tmp/out/results/." results/
          git add results
          git commit -m "Résultats scan ZAP CASA $D"
          git push origin casa-zap-results
