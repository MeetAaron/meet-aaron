# Scan des dépendances (CASA 6.1.1) : « l'application n'utilise que des
# composants sans vulnérabilité exploitable connue ».
#
# Depuis le 22/10/2026, package-lock.json est COMMITÉ (passage à Next 15) :
# le scan porte sur les versions exactes que Vercel installe. Deux audits :
#   1. PRODUCTION (`npm audit --omit=dev`) : BLOQUANT. Le run échoue s'il
#      reste une vulnérabilité high ou critique dans ce qui part en
#      production.
#   2. COMPLET (outils de construction compris) : informatif, publié dans
#      le résumé du run et en artefact, pour que rien ne soit caché. Les
#      paquets "dev": true (Tailwind, PostCSS de construction, etc.) ne
#      s'exécutent qu'au build, sur notre propre code source.
# Il tourne chaque lundi, à chaque changement de package.json ou du
# lockfile, et à la demande. Dependabot ouvre en plus les PR de sécurité.
name: Dependency audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]
    paths: ["package.json", "package-lock.json", ".github/workflows/dependency-audit.yml"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Versions résolues (lockfile commité)
        run: |
          node -e '
            const l = require("./package-lock.json");
            const want = Object.assign({}, require("./package.json").dependencies, require("./package.json").devDependencies);
            for (const name of Object.keys(want)) {
              const v = (l.packages["node_modules/" + name] || {}).version;
              console.log(name.padEnd(28), String(want[name]).padEnd(52), "->", v);
            }
          '

      - name: Audit complet (informatif)
        run: |
          set +e
          npm audit --json > audit-full.json
          node -e '
            const a = require("./audit-full.json");
            const l = require("./package-lock.json");
            const m = a.metadata && a.metadata.vulnerabilities || {};
            console.log("Complet :", JSON.stringify(m));
            for (const [name, v] of Object.entries(a.vulnerabilities || {})) {
              const where = (v.nodes || []).map(n => n + (l.packages[n] && l.packages[n].dev ? " [dev]" : " [PROD]")).join(", ");
              console.log("-", name, v.severity, v.range, "|", where);
            }
          '
          exit 0

      - name: Audit production (BLOQUANT si high/critique)
        id: audit
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > audit.json
          code=$?
          node -e '
            const a = require("./audit.json");
            const m = a.metadata && a.metadata.vulnerabilities || {};
            console.log("Production :", JSON.stringify(m));
            for (const [name, v] of Object.entries(a.vulnerabilities || {})) {
              console.log("-", name, v.severity, v.range, "fixAvailable=" + JSON.stringify(v.fixAvailable));
              for (const x of v.via || []) {
                if (typeof x === "string") { console.log("    via", x); continue; }
                console.log("    *", x.severity, x.title, "| range", x.range, "|", x.url);
              }
            }
          '
          echo "## npm audit — $(date -u +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const row = (label, f) => { const m = (require(f).metadata || {}).vulnerabilities || {}; return `| ${label} | ${m.critical||0} | ${m.high||0} | ${m.moderate||0} | ${m.low||0} | ${m.total||0} |`; };
            console.log("| scope | critical | high | moderate | low | total |");
            console.log("|---|---|---|---|---|---|");
            console.log(row("production (bloquant)", "./audit.json"));
            console.log(row("complet, outils de build compris (informatif)", "./audit-full.json"));
          ' >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Publier les rapports et le lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_number }}
          path: |
            audit.json
            audit-full.json
            package-lock.json
