# codemagic.yaml
#
# COMPILATION iOS SANS POSSEDER DE MAC.
#
# Apple n'autorise la compilation d'une application iOS que sur macOS. Alex
# est sous Windows, l'environnement de developpement tourne sous Linux :
# personne ici ne peut produire le fichier. On loue donc une machine macOS a
# la demande — Codemagic en offre 500 minutes par mois, largement de quoi
# publier et mettre a jour.
#
# Le projet Xcode n'est PAS dans le depot : il est genere a chaque
# compilation par `npx cap add ios` (voir ios-app/README.md pour le
# pourquoi), puis retouche par ios-app/patch-ios.rb.
#
# CE QU'IL FAUT AVOIR CONFIGURE DANS CODEMAGIC AVANT LE PREMIER LANCEMENT :
#   - une integration « App Store Connect » nommee  meet-aaron-asc
#     (Codemagic → Teams → Integrations → App Store Connect → Add key).
#     C'est elle qui genere et renouvelle les certificats tout seule : c'est
#     la partie qui fait perdre des journees quand on la fait a la main.
#   - le groupe de variables appstore_credentials (voir plus bas).
#   - dans le portail developpeur Apple (Identifiers → app.meetaaron.mobile),
#     les capacites Push Notifications et Associated Domains cochees : le
#     profil de provisionnement doit couvrir les habilitations que pose
#     ios-app/patch-ios.rb, sinon la signature echoue.
#   - dans App Store Connect, la fiche de l'app creee (Apps → + → Nouvelle
#     app, bundle app.meetaaron.mobile) : TestFlight n'accepte un build que
#     pour une app existante.

workflows:
  ios-release:
    name: Meet Aaron — iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      # Capacitor 8 exige Xcode 26 et Node 22 (mise a jour du 07/11/2026).
      xcode: 26.0
      cocoapods: default
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.meetaaron.mobile
      vars:
        APP_VERSION: '1.0.0'
      groups:
        # Groupe de variables a creer dans Codemagic, contenant :
        #   APP_STORE_CONNECT_ISSUER_ID
        #   APP_STORE_CONNECT_KEY_IDENTIFIER
        #   APP_STORE_CONNECT_PRIVATE_KEY
        #   APP_STORE_APP_ID   (identifiant numerique de l'app dans App Store
        #                       Connect, visible dans l'URL de sa fiche — sert a
        #                       numeroter les builds a la suite de TestFlight)
        - appstore_credentials

    scripts:
      - name: Installer les dependances de la coque
        script: |
          cd ios-app
          npm ci || npm install

      - name: Generer le projet Xcode
        script: |
          cd ios-app
          # `cap add ios` echoue s'il existe deja : on repart toujours propre,
          # c'est le principe d'un projet genere.
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Generer les icones et l'ecran de lancement
        script: |
          cd ios-app
          npx @capacitor/assets generate --ios --assetPath assets

      - name: Retoucher le projet Xcode (habilitations, version, Info.plist)
        script: |
          cd ios-app
          gem install xcodeproj plist --no-document
          # Numero de build : le dernier de TestFlight + 1 ; sans
          # APP_STORE_APP_ID, le compteur de builds Codemagic (jamais deux
          # fois le meme numero, sinon App Store Connect refuse l'envoi).
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || true)
          if [ -n "$LATEST" ] && [ "$LATEST" -eq "$LATEST" ] 2>/dev/null; then
            BUILD_NUMBER=$((LATEST + 1))
          else
            BUILD_NUMBER=$((${BUILD_NUMBER:-0} + 100))
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER"
          APP_VERSION="$APP_VERSION" BUILD_NUMBER="$BUILD_NUMBER" ruby patch-ios.rb

      - name: Installer les pods
        script: |
          cd ios-app/ios/App
          pod install

      - name: Appliquer la signature automatique
        script: |
          cd ios-app/ios/App
          keychain initialize
          app-store-connect fetch-signing-files app.meetaaron.mobile --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Compiler l'archive
        script: |
          cd ios-app/ios/App
          xcode-project build-ipa --workspace App.xcworkspace --scheme App

    artifacts:
      - ios-app/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Envoi sur TestFlight uniquement. La mise en vente publique reste un
        # clic manuel dans App Store Connect : on ne publie jamais tout seul.
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          # 14/10/2026 : alexandre@meetaaron.app supprimee (licence Workspace
          # inutilisee). Les notifications de build arrivent desormais sur la
          # boite principale.
          - aaron@meetaaron.app
        notify:
          success: true
          failure: true
